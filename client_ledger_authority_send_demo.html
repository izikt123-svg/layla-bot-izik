<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כרטסת לקוח - שליחה לרשות</title>
  <link rel="stylesheet" href="theme_navy_glass.css" />
  <style>
    main{padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    button{background:linear-gradient(130deg,rgba(85,194,255,.24),rgba(31,95,191,.28));color:#eef6ff;border:1px solid rgba(85,194,255,.5);border-radius:12px;padding:10px 14px;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:6px 0;font-size:14px;color:#d8ebff}
    .modal{position:fixed;inset:0;background:rgba(5,12,30,.68);display:none;align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}.panel{width:min(780px,95vw)} select,input,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#eef6ff;border-radius:10px;padding:8px}
    label{font-size:12px;color:#d8ebff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  </style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark"></div><div><h1>כרטסת לקוח — חברת אור בע״מ</h1><p>שליחה מיידית לרשות מתוך כרטיס לקוח</p></div></div></header>
<main>
  <div class="toolbar">
    <button id="sendBtn">שלח לרשות</button>
    <button>הפק מכתב אוטומטי</button>
    <button>פתח קישור רשות רשמי</button>
    <button>צרף מסמכים נדרשים</button>
    <button>תעד סטטוס הגשה</button>
  </div>

  <section class="card row">
    <div>
      <h2>פרטי לקוח</h2>
      <div class="field">שם: חברת אור בע״מ</div>
      <div class="field">ח"פ: 515555555</div>
      <div class="field">מנהל תיק: אליס טורקיה</div>
      <div class="field">סוג דיווח מע״מ: חודשי</div>
    </div>
    <div>
      <h2>סטטוס ציות</h2>
      <div class="field">פנייה אחרונה: 20.05.2026</div>
      <div class="field">סטטוס: Acknowledged</div>
      <div class="field">מסמכים חסרים: 1</div>
      <div class="field">SLA: 96.2%</div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="card panel">
    <h2>שליחה מיידית לרשות</h2>
    <div class="grid">
      <div><label>רשות</label><select><option>מע"מ</option><option>מס הכנסה</option><option>ביטוח לאומי</option></select></div>
      <div><label>סוג פנייה</label><select><option>בקשת ארכה להגשת דו"ח</option><option>בקשה לביטול/הפחתת קנס</option><option>בקשת פריסת חוב</option></select></div>
      <div><label>תקופה</label><input value="04/2026" /></div>
      <div><label>נציג מטפל</label><input value="אליס טורקיה" /></div>
    </div>
    <div style="margin-top:10px"><label>נימוק</label><textarea rows="4">נדרש זמן נוסף לקבלת מסמכים תומכים מהלקוח.</textarea></div>
    <div class="toolbar" style="margin-top:12px">
      <button onclick="closeModal()">ביטול</button>
      <button onclick="alert('נשלח בהצלחה ונוצר Audit + Follow-up')">שלח לרשות</button>
    </div>
  </div>
</div>

<script>
  const modal=document.getElementById('modal');
  document.getElementById('sendBtn').addEventListener('click',()=>modal.classList.add('open'));
  function closeModal(){modal.classList.remove('open')}
</script>
</body>
</html>
