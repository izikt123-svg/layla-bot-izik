<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="מרכז התפילה">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a3358"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1d597"/>
      <stop offset="55%" stop-color="#c6a054"/>
      <stop offset="100%" stop-color="#7a5a23"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- subtle radial glow -->
  <circle cx="32" cy="28" r="20" fill="#f1d597" opacity="0.08"/>
  <!-- magen david / star of David -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round">
    <polygon points="32,12 40,26 24,26"/>
    <polygon points="32,46 40,32 24,32"/>
  </g>
  <!-- flame at the center -->
  <path d="M32 22c1.6 1.8 2.4 3.4 2.4 4.8a2.4 2.4 0 1 1-4.8 0c0-1.4 0.8-3 2.4-4.8z" fill="#f1d597"/>
</svg>
