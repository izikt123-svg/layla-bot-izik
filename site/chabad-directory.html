<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בתי חב״ד בעולם</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e5e7eb;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --gold: #b7791f;
      --shadow: 0 10px 25px rgba(16, 24, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .chabad-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 16px 42px;
    }
    .hero {
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
    }
    .hero p {
      margin: 0;
      opacity: .92;
      font-size: 16px;
      line-height: 1.7;
    }
    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
    }
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 18px;
    }
    .quick button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 14px;
    }
    .quick button:hover { border-color: var(--primary); color: var(--primary-dark); }
    .meta {
      color: var(--muted);
      margin: 10px 4px 16px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 260px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }
    .location {
      color: var(--primary-dark);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .address {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 10px;
      min-height: 42px;
    }
    .badge {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      margin-bottom: 14px;
    }
    .badge.partial {
      background: #fffbeb;
      color: #92400e;
      border-color: #fde68a;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }
    .btn {
      text-decoration: none;
      text-align: center;
      border-radius: 13px;
      padding: 10px 9px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .btn:hover { filter: brightness(.97); }
    .empty {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
    .note {
      margin-top: 22px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hero { border-radius: 18px; padding: 20px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>

    const searchInput = document.getElementById('searchInput');
    const countryFilter = document.getElementById('countryFilter');
    const verifiedFilter = document.getElementById('verifiedFilter');
    const cardsGrid = document.getElementById('cardsGrid');
    const resultMeta = document.getElementById('resultMeta');

    function encodeQuery(value) {
      return encodeURIComponent(value || '');
    }

    function safe(value) {
      return String(value || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function initCountries() {
      // Dedup centers (in-place, by normalized name+city) — safety net.
      const seen = new Set();
      for (let i = centers.length - 1; i >= 0; i--) {
        const key = (String(centers[i].name || '') + '|' + String(centers[i].city || '')).toLowerCase().replace(/\s+/g, ' ').trim();
        if (seen.has(key)) centers.splice(i, 1);
        else seen.add(key);
      }
      const countries = [...new Set(centers.map(c => c.country).filter(Boolean))].sort();
      countries.forEach(country => {
        const opt = document.createElement('option');
        opt.value = country;
        opt.textContent = country;
        countryFilter.appendChild(opt);
      });
    }

    function cardTemplate(item) {
      const query = item.address || `${item.name} ${item.city} ${item.country}`;
      const waze = `https://waze.com/ul?q=${encodeQuery(query)}&navigate=yes`;
      const gmaps = `https://www.google.com/maps/search/?api=1&query=${encodeQuery(query)}`;
      const badgeClass = item.verified === 'מאומת' ? 'badge' : 'badge partial';
      const phone = item.phone ? `<a class="btn" href="tel:${safe(item.phone)}">📞 התקשר</a>` : '';
      const site = item.website ? `<a class="btn" href="${safe(item.website)}" target="_blank" rel="noopener">🌐 אתר</a>` : '';

      return `
        <article class="card">
          <h3>${safe(item.name)}</h3>
          <div class="location">${safe(item.city)} · ${safe(item.country)}</div>
          <div class="address">${safe(item.address || 'כתובת דורשת השלמה')}</div>
          <span class="${badgeClass}">${safe(item.verified || 'דורש השלמה')}</span>
          <div class="actions">
            <a class="btn primary" href="${waze}" target="_blank" rel="noopener">🚗 Waze</a>
            <a class="btn" href="${gmaps}" target="_blank" rel="noopener">📍 Google Maps</a>
            ${phone}
            ${site}
          </div>
        </article>
      `;
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const country = countryFilter.value;
      const verified = verifiedFilter.value;

      const filtered = centers.filter(item => {
        const text = `${item.name} ${item.city} ${item.country} ${item.address}`.toLowerCase();
        const matchQ = !q || text.includes(q);
        const matchCountry = !country || item.country === country;
        const matchVerified = !verified || item.verified === verified;
        return matchQ && matchCountry && matchVerified;
      });

      resultMeta.textContent = `מציג ${filtered.length} מתוך ${centers.length} רשומות`;
      cardsGrid.innerHTML = filtered.length
        ? filtered.map(cardTemplate).join('')
        : `<div class="empty">לא נמצאו תוצאות. נסה לחפש מדינה או עיר אחרת.</div>`;
    }

    document.querySelectorAll('[data-quick]').forEach(btn => {
      btn.addEventListener('click', () => {
        searchInput.value = btn.dataset.quick || '';
        countryFilter.value = '';
        verifiedFilter.value = '';
        render();
      });
    });

    searchInput.addEventListener('input', render);
    countryFilter.addEventListener('change', render);
    verifiedFilter.addEventListener('change', render);

    initCountries();
    render();
  </script>
  <script src="kz.js" defer></script>
</body>
</html>
