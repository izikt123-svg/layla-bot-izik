functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "default"
plugins = []

[build]
publish = "/opt/build/repo"
publishOrigin = "default"
functions = "/opt/build/repo/netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(self), camera=(), payment=(), usb=()"
  Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  X-XSS-Protection = "1; mode=block"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.hebcal.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Cache-Control = "public, max-age=300"
  Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Service-Worker-Allowed = "/"

[[headers]]
for = "/styles.css"

  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/script.js"

  [headers.values]
  Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/favicon.svg"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.jpg"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.svg"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.woff2"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

