<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עמוד | מרכז התפילה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand-wrap" href="index.html">
      <div class="star">
        <svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
          <polygon points="32,6 40,22 58,22 46,34 50,52 32,42 14,52 18,34 6,22 24,22" />
        </svg>
      </div>
      <div class="brand">
        <span class="brand-main">מרכז התפילה</span>
        <span class="brand-sub">עמוד תוכן</span>
      </div>
    </a>
    <nav class="nav">
      <a href="index.html">חזרה לאתר</a>
    </nav>
  </header>

  <main class="public-page" id="pageRoot">
    <div class="public-loading">טוען את העמוד…</div>
  </main>

  <script>
  (async function(){
    const root = document.getElementById('pageRoot');
    const slug = new URLSearchParams(location.search).get('slug') || '';
    if (!slug){
      root.innerHTML = '<div class="public-loading">חסרה כתובת עמוד. חזור <a href="index.html">לבית</a>.</div>';
      return;
    }
    try {
      const r = await fetch(`/.netlify/functions/admin-content?type=page&slug=${encodeURIComponent(slug)}`);
      const data = await r.json();
      if (!r.ok || !data.ok || !data.item) throw new Error(data.error || 'not-found');
      const { title, content, updated } = data.item;
      document.title = `${title} | מרכז התפילה`;
      const d = new Date(updated);
      const meta = isFinite(d) ? d.toLocaleDateString('he-IL', { day:'numeric', month:'long', year:'numeric' }) : '';
      root.innerHTML = `
        <div class="public-meta">${meta ? 'עודכן · ' + meta : ''}</div>
        <h1></h1>
        <div class="public-body"></div>
      `;
      root.querySelector('h1').textContent = title;
      root.querySelector('.public-body').textContent = content;
    } catch (err) {
      root.innerHTML = `<div class="public-loading">העמוד לא נמצא. <a href="index.html">חזרה לבית</a></div>`;
    }
  })();
  </script>
</body>
</html>
